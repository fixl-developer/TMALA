<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Studio — Hill Station Hero</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Rajdhani:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --sky-top: #0a0e1a;
    --sky-mid: #1a2744;
    --sky-dawn: #2d4a7a;
    --fog: #8aabcc;
    --mist: #c4d8e8;
    --pine-dark: #0d1f0f;
    --pine-mid: #1a3d1c;
    --pine-light: #2a5e2d;
    --snow: #e8f0f5;
    --gold: #c8a96e;
    --text-light: #e8f0f5;
  }

  html { scroll-behavior: auto; }

  body {
    background: #0a0e1a;
    font-family: 'Rajdhani', sans-serif;
    overflow-x: hidden;
  }

  /* ─── HERO CONTAINER ─── */
  #hero {
    position: relative;
    height: 600vh;
    background: transparent;
  }

  .sticky-viewport {
    position: sticky;
    top: 0;
    height: 100vh;
    width: 100%;
    overflow: hidden;
    background: #0a0e1a;
  }

  /* ─── CANVAS SVG SCENE ─── */
  .scene {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  /* ─── INDIVIDUAL LAYERS ─── */
  .layer {
    position: absolute;
    width: 100%;
    height: 100%;
    transition: none;
    will-change: transform, opacity;
  }

  /* ─── STARS ─── */
  .stars {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 60%, #0a0e1a 100%);
  }
  .star {
    position: absolute;
    background: white;
    border-radius: 50%;
    animation: twinkle var(--d, 3s) ease-in-out infinite;
    animation-delay: var(--delay, 0s);
    opacity: var(--op, 0.8);
  }
  @keyframes twinkle {
    0%, 100% { opacity: var(--op, 0.8); transform: scale(1); }
    50% { opacity: 0.2; transform: scale(0.6); }
  }

  /* ─── SKY GRADIENT ─── */
  #sky-gradient {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      180deg,
      #060810 0%,
      #0e1a33 30%,
      #1e3a6e 60%,
      #3a6899 80%,
      #7aaabf 100%
    );
    transition: background 0.1s;
  }

  /* ─── SUN/MOON ─── */
  #celestial {
    position: absolute;
    border-radius: 50%;
    filter: blur(2px);
    transform-origin: center;
  }

  /* ─── CLOUD LAYERS ─── */
  .cloud-layer {
    position: absolute;
    width: 200%;
    height: 40%;
    left: -50%;
  }

  /* ─── FOG ─── */
  #fog-layer {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 50%;
    background: linear-gradient(
      180deg,
      transparent 0%,
      rgba(138, 171, 204, 0.1) 30%,
      rgba(196, 216, 232, 0.4) 70%,
      rgba(196, 216, 232, 0.8) 100%
    );
  }

  /* ─── UI OVERLAY ─── */
  #ui-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    z-index: 50;
  }

  .tagline {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 300;
    font-size: clamp(0.8rem, 1.5vw, 1rem);
    letter-spacing: 0.4em;
    color: rgba(200, 169, 110, 0.9);
    text-transform: uppercase;
    margin-bottom: 1.5rem;
    opacity: 0;
    transform: translateY(20px);
    animation: fadeUp 1.2s ease forwards 0.4s;
  }

  .hero-title {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-size: clamp(3.5rem, 10vw, 8rem);
    color: var(--text-light);
    line-height: 0.9;
    text-align: center;
    letter-spacing: -0.02em;
    opacity: 0;
    transform: translateY(30px);
    animation: fadeUp 1.4s ease forwards 0.6s;
  }

  .hero-title em {
    font-style: italic;
    color: var(--gold);
  }

  .hero-sub {
    font-family: 'Rajdhani', sans-serif;
    font-weight: 300;
    font-size: clamp(0.85rem, 1.5vw, 1rem);
    letter-spacing: 0.25em;
    color: rgba(232, 240, 245, 0.6);
    text-transform: uppercase;
    margin-top: 2rem;
    opacity: 0;
    animation: fadeUp 1.4s ease forwards 1s;
  }

  @keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
  }

  /* ─── ALTITUDE INDICATOR ─── */
  #altitude-meter {
    position: absolute;
    right: 3rem;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.5rem;
    z-index: 60;
    pointer-events: none;
  }

  .alt-label {
    font-size: 0.6rem;
    letter-spacing: 0.2em;
    color: rgba(200, 169, 110, 0.7);
    text-transform: uppercase;
    writing-mode: vertical-rl;
    transform: rotate(180deg);
  }

  .alt-track {
    width: 2px;
    height: 120px;
    background: rgba(200, 169, 110, 0.2);
    border-radius: 2px;
    position: relative;
    overflow: hidden;
  }

  .alt-fill {
    position: absolute;
    bottom: 0;
    width: 100%;
    background: linear-gradient(0deg, #c8a96e, rgba(200, 169, 110, 0.3));
    border-radius: 2px;
    transition: height 0.1s ease;
  }

  .alt-value {
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    color: rgba(200, 169, 110, 0.9);
    font-family: 'Rajdhani', monospace;
  }

  /* ─── VIEW LABEL ─── */
  #view-label {
    position: absolute;
    left: 3rem;
    bottom: 3rem;
    z-index: 60;
    pointer-events: none;
  }

  .view-name {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: clamp(1.2rem, 2.5vw, 1.8rem);
    color: rgba(200, 169, 110, 0.9);
    line-height: 1;
    transition: opacity 0.4s ease, transform 0.4s ease;
  }

  .view-desc {
    font-size: 0.7rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: rgba(232, 240, 245, 0.4);
    margin-top: 0.3rem;
    transition: opacity 0.4s ease;
  }

  /* ─── SCROLL CUE ─── */
  #scroll-cue {
    position: absolute;
    bottom: 2.5rem;
    left: 50%;
    transform: translateX(-50%);
    z-index: 60;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.5rem;
    opacity: 1;
    transition: opacity 0.5s;
  }

  .scroll-text {
    font-size: 0.6rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: rgba(232, 240, 245, 0.4);
  }

  .scroll-line {
    width: 1px;
    height: 40px;
    background: linear-gradient(180deg, rgba(200,169,110,0.8), transparent);
    animation: scrollPulse 2s ease-in-out infinite;
  }

  @keyframes scrollPulse {
    0%, 100% { transform: scaleY(1); opacity: 1; }
    50% { transform: scaleY(0.6); opacity: 0.4; }
  }

  /* ─── CANVAS ─── */
  #hill-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  /* ─── VIGNETTE ─── */
  .vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 50%, rgba(6,8,16,0.7) 100%);
    pointer-events: none;
    z-index: 40;
  }

  /* ─── SECTION AFTER HERO ─── */
  .after-hero {
    background: #060810;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 1.5rem;
    padding: 5rem 2rem;
  }

  .after-hero h2 {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(2rem, 5vw, 4rem);
    color: var(--text-light);
    font-weight: 300;
    text-align: center;
  }

  .after-hero p {
    color: rgba(232,240,245,0.5);
    letter-spacing: 0.15em;
    font-size: 0.9rem;
    text-transform: uppercase;
    text-align: center;
  }
</style>
</head>
<body>

<section id="hero">
  <div class="sticky-viewport">
    <!-- Canvas for procedural hill rendering -->
    <canvas id="hill-canvas"></canvas>

    <!-- Vignette -->
    <div class="vignette"></div>

    <!-- UI -->
    <div id="ui-overlay">
      <div class="tagline">Intelligence meets nature</div>
      <div class="hero-title"><em>AI</em> Studio</div>
      <div class="hero-sub">Where ideas reach new heights</div>
    </div>

    <!-- Altitude Meter -->
    <div id="altitude-meter">
      <div class="alt-label">Altitude</div>
      <div class="alt-track">
        <div class="alt-fill" id="alt-fill" style="height:95%"></div>
      </div>
      <div class="alt-value" id="alt-value">4200m</div>
    </div>

    <!-- View label -->
    <div id="view-label">
      <div class="view-name" id="view-name">Aerial Zenith</div>
      <div class="view-desc" id="view-desc">Bird's eye — 4200m above sea level</div>
    </div>

    <!-- Scroll cue -->
    <div id="scroll-cue">
      <span class="scroll-text">Descend</span>
      <div class="scroll-line"></div>
    </div>
  </div>
</section>

<section class="after-hero">
  <h2>Welcome to the Summit</h2>
  <p>Build extraordinary AI — one altitude at a time</p>
</section>

<script>
const canvas = document.getElementById('hill-canvas');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', () => { resize(); draw(progress); });

// ─── SCROLL PROGRESS ───
let progress = 0; // 0 = top aerial, 1 = ground level

function getProgress() {
  const hero = document.getElementById('hero');
  const scrollTop = window.scrollY;
  const maxScroll = hero.offsetHeight - window.innerHeight;
  return Math.max(0, Math.min(1, scrollTop / maxScroll));
}

// ─── NOISE HELPERS ───
function noise(x, seed = 0) {
  const v = Math.sin(x * 127.1 + seed * 311.7) * 43758.5453;
  return v - Math.floor(v);
}

function smoothNoise(x, seed = 0) {
  const i = Math.floor(x);
  const f = x - i;
  const t = f * f * (3 - 2 * f);
  return noise(i, seed) * (1 - t) + noise(i + 1, seed) * t;
}

function fbm(x, seed = 0, octaves = 5) {
  let val = 0, amp = 0.5, freq = 1, max = 0;
  for (let i = 0; i < octaves; i++) {
    val += smoothNoise(x * freq, seed + i * 100) * amp;
    max += amp;
    amp *= 0.5;
    freq *= 2.1;
  }
  return val / max;
}

// ─── MOUNTAIN RIDGE GENERATOR ───
function getRidge(t, seed, amplitude, baseY, warp = 1) {
  const points = [];
  for (let x = 0; x <= W; x += 4) {
    const nx = (x / W) * warp;
    const y = baseY - fbm(nx + seed, seed) * amplitude;
    points.push([x, y]);
  }
  return points;
}

// ─── COLOR LERP ───
function lerpColor(a, b, t) {
  const parse = c => {
    const r = parseInt(c.slice(1,3),16),
          g = parseInt(c.slice(3,5),16),
          b_ = parseInt(c.slice(5,7),16);
    return [r,g,b_];
  };
  const [r1,g1,b1] = parse(a);
  const [r2,g2,b2] = parse(b);
  return `rgb(${Math.round(r1+(r2-r1)*t)},${Math.round(g1+(g2-g1)*t)},${Math.round(b1+(b1-b2)*t < 0 ? b1+(b2-b1)*t : b1+(b2-b1)*t)})`;
}

function lerp(a, b, t) { return a + (b - a) * t; }

function easeInOut(t) { return t < 0.5 ? 2*t*t : -1+(4-2*t)*t; }

// ─── DRAW STARS ───
const stars = Array.from({length: 200}, () => ({
  x: Math.random(),
  y: Math.random() * 0.55,
  r: Math.random() * 1.5 + 0.3,
  op: Math.random() * 0.8 + 0.2,
  tw: Math.random() * 3 + 1.5,
  phase: Math.random() * Math.PI * 2
}));

let time = 0;

function drawStars(skyFade) {
  if (skyFade <= 0) return;
  stars.forEach(s => {
    const twinkle = 0.5 + 0.5 * Math.sin(time / s.tw + s.phase);
    ctx.beginPath();
    ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${s.op * twinkle * skyFade})`;
    ctx.fill();
  });
}

// ─── MOON ───
function drawMoon(p) {
  const fade = Math.max(0, 1 - p * 3);
  if (fade <= 0) return;
  const moonX = W * 0.75;
  const moonY = H * lerp(0.12, 0.3, p);
  const moonR = lerp(28, 18, p);

  // Glow
  const grd = ctx.createRadialGradient(moonX, moonY, 0, moonX, moonY, moonR * 3);
  grd.addColorStop(0, `rgba(200,210,230,${0.15 * fade})`);
  grd.addColorStop(1, 'transparent');
  ctx.fillStyle = grd;
  ctx.beginPath();
  ctx.arc(moonX, moonY, moonR * 3, 0, Math.PI * 2);
  ctx.fill();

  ctx.beginPath();
  ctx.arc(moonX, moonY, moonR, 0, Math.PI * 2);
  ctx.fillStyle = `rgba(220,230,245,${fade})`;
  ctx.fill();
}

// ─── SUN ───
function drawSun(p) {
  const fade = Math.max(0, (p - 0.5) * 2);
  if (fade <= 0) return;
  const sunX = W * 0.3;
  const sunY = H * lerp(0.8, 0.18, fade);
  const sunR = lerp(20, 38, fade);

  // Rays
  const grd = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, sunR * 5);
  grd.addColorStop(0, `rgba(255,200,80,${0.25 * fade})`);
  grd.addColorStop(0.4, `rgba(255,160,40,${0.1 * fade})`);
  grd.addColorStop(1, 'transparent');
  ctx.fillStyle = grd;
  ctx.beginPath();
  ctx.arc(sunX, sunY, sunR * 5, 0, Math.PI * 2);
  ctx.fill();

  ctx.beginPath();
  ctx.arc(sunX, sunY, sunR, 0, Math.PI * 2);
  const sg = ctx.createRadialGradient(sunX - sunR * 0.3, sunY - sunR * 0.3, 0, sunX, sunY, sunR);
  sg.addColorStop(0, `rgba(255,240,150,${fade})`);
  sg.addColorStop(1, `rgba(255,160,40,${fade})`);
  ctx.fillStyle = sg;
  ctx.fill();
}

// ─── SKY ───
function drawSky(p) {
  const skyColors = [
    { r: 6,  g: 8,  b: 16  }, // p=0 deep night
    { r: 10, g: 18, b: 40  }, // p=0.2 night
    { r: 20, g: 40, b: 80  }, // p=0.4 pre-dawn
    { r: 60, g: 90, b: 140 }, // p=0.6 dawn
    { r: 120,g: 160,b: 200 }, // p=0.8 morning
    { r: 160,g: 200,b: 230 }, // p=1.0 day
  ];

  function sampleSky(t) {
    const idx = Math.min(Math.floor(t * (skyColors.length - 1)), skyColors.length - 2);
    const frac = t * (skyColors.length - 1) - idx;
    const a = skyColors[idx], b = skyColors[idx+1];
    return {
      r: Math.round(lerp(a.r, b.r, frac)),
      g: Math.round(lerp(a.g, b.g, frac)),
      b: Math.round(lerp(a.b, b.b, frac))
    };
  }

  const topC = sampleSky(p * 0.7);
  const botC = sampleSky(Math.min(1, p * 0.7 + 0.3));

  const grd = ctx.createLinearGradient(0, 0, 0, H);
  grd.addColorStop(0, `rgb(${topC.r},${topC.g},${topC.b})`);
  grd.addColorStop(1, `rgb(${botC.r},${botC.g},${botC.b})`);
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, W, H);
}

// ─── CLOUD STRIPE ───
function drawClouds(p) {
  const cloudAlpha = Math.sin(Math.PI * p) * 0.6 + (p < 0.5 ? p * 0.3 : (1-p) * 0.3);
  if (cloudAlpha <= 0.02) return;

  ctx.save();
  for (let layer = 0; layer < 3; layer++) {
    const yBase = H * lerp(0.15 + layer * 0.08, 0.3 + layer * 0.1, p);
    const offset = (time * (0.1 + layer * 0.05)) % (W * 0.5);

    for (let i = -1; i < 4; i++) {
      const cx = (i * W * 0.4 + offset) % (W * 1.5) - W * 0.2;
      const cw = W * (0.15 + layer * 0.05 + smoothNoise(i + layer * 10) * 0.1);
      const ch = H * (0.04 + layer * 0.02);

      const cg = ctx.createRadialGradient(cx, yBase, 0, cx, yBase, cw * 0.5);
      cg.addColorStop(0, `rgba(255,255,255,${0.12 * cloudAlpha})`);
      cg.addColorStop(0.5, `rgba(200,220,240,${0.06 * cloudAlpha})`);
      cg.addColorStop(1, 'transparent');
      ctx.fillStyle = cg;
      ctx.beginPath();
      ctx.ellipse(cx, yBase, cw * 0.5, ch, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.restore();
}

// ─── MOUNTAIN RANGES ───
function drawMountains(p) {
  const ep = easeInOut(p);

  // We have 5 ranges. As p increases, camera "descends" so:
  // - background peaks shrink and move up
  // - foreground fills more of the frame
  const ranges = [
    // [seed, baseY_ratio_aerial, baseY_ratio_ground, amp_aerial, amp_ground, color_aerial, color_ground]
    [1.2, 0.72, 1.1,  H*0.55, H*0.9,  [15,25,45],  [8,18,30]   ],
    [2.5, 0.78, 1.2,  H*0.42, H*0.75, [20,35,60],  [12,28,40]  ],
    [3.8, 0.82, 1.3,  H*0.35, H*0.65, [30,55,80],  [18,42,55]  ],
    [5.1, 0.87, 1.5,  H*0.28, H*0.5,  [20,50,30],  [25,55,35]  ],
    [6.4, 0.95, 1.8,  H*0.20, H*0.35, [15,38,20],  [40,80,45]  ],
  ];

  ranges.forEach(([seed, baseAerial, baseGround, ampA, ampG, colA, colG], i) => {
    const baseY = H * lerp(baseAerial, baseGround, ep);
    const amp = lerp(ampA, ampG, ep);
    const cr = Math.round(lerp(colA[0], colG[0], ep));
    const cg = Math.round(lerp(colA[1], colG[1], ep));
    const cb = Math.round(lerp(colA[2], colG[2], ep));

    // Snow caps
    const snowLine = H * lerp(0.3, 0.15, ep);
    const ridge = getRidge(p, seed, amp, baseY, lerp(1, 2.5, ep));

    // Snow gradient grd
    ctx.beginPath();
    ridge.forEach(([x, y], j) => j === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y));
    ctx.lineTo(W, H);
    ctx.lineTo(0, H);
    ctx.closePath();

    // Mountain fill
    const mg = ctx.createLinearGradient(0, baseY - amp, 0, baseY + 50);
    mg.addColorStop(0, `rgba(${cr + 30},${cg + 30},${cb + 30},1)`);
    mg.addColorStop(0.3, `rgba(${cr},${cg},${cb},1)`);
    mg.addColorStop(1, `rgba(${Math.max(0,cr-10)},${Math.max(0,cg-10)},${Math.max(0,cb-10)},1)`);
    ctx.fillStyle = mg;
    ctx.fill();

    // Snow overlay
    if (i < 3) {
      ctx.save();
      ctx.clip();
      const snowGrd = ctx.createLinearGradient(0, snowLine - H*0.1, 0, snowLine + H*0.05);
      snowGrd.addColorStop(0, `rgba(220,235,245,${lerp(0.9, 0.7, ep)})`);
      snowGrd.addColorStop(1, 'transparent');
      ctx.fillStyle = snowGrd;
      ctx.fillRect(0, 0, W, snowLine + H * 0.05);
      ctx.restore();

      // Re-clip for snow
      ctx.beginPath();
      ridge.forEach(([x, y], j) => j === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y));
      ctx.lineTo(W, H);
      ctx.lineTo(0, H);
      ctx.closePath();
    }

    // Mist on lower ranges
    if (i > 1) {
      ctx.save();
      const mistAlpha = lerp(0.2, 0.05, ep) * (1 - i * 0.1);
      const mistGrd = ctx.createLinearGradient(0, baseY - amp * 0.3, 0, baseY + 20);
      mistGrd.addColorStop(0, 'transparent');
      mistGrd.addColorStop(1, `rgba(140,175,210,${mistAlpha})`);
      ctx.fillStyle = mistGrd;
      ctx.fillRect(0, baseY - amp * 0.3, W, amp * 0.3 + 20);
      ctx.restore();
    }
  });
}

// ─── TREES (visible when close) ───
function drawTrees(p) {
  if (p < 0.4) return;
  const fade = Math.min(1, (p - 0.4) * 3.3);
  const treeBase = H * lerp(1.2, 0.75, easeInOut(p));
  const treeH = H * lerp(0.02, 0.12, p) * fade;
  const count = 35;

  for (let i = 0; i < count; i++) {
    const nx = i / count;
    const tx = nx * W + smoothNoise(nx * 7, i) * 40 - 20;
    const ty = treeBase + smoothNoise(nx * 5, i + 50) * H * 0.04;
    const th = treeH * (0.7 + smoothNoise(nx * 3, i + 100) * 0.6);
    const tw = th * 0.35;

    const gr = Math.round(lerp(15, 30, smoothNoise(nx)));
    const gg = Math.round(lerp(40, 70, smoothNoise(nx * 2)));
    const gb = Math.round(lerp(15, 30, smoothNoise(nx * 3)));

    ctx.beginPath();
    ctx.moveTo(tx, ty);
    ctx.lineTo(tx - tw, ty + th);
    ctx.lineTo(tx + tw, ty + th);
    ctx.closePath();
    ctx.fillStyle = `rgba(${gr},${gg},${gb},${fade * 0.9})`;
    ctx.fill();

    // Second tier
    ctx.beginPath();
    ctx.moveTo(tx, ty + th * 0.3);
    ctx.lineTo(tx - tw * 1.3, ty + th * 0.9 + th * 0.3);
    ctx.lineTo(tx + tw * 1.3, ty + th * 0.9 + th * 0.3);
    ctx.closePath();
    ctx.fillStyle = `rgba(${Math.max(0,gr-5)},${Math.max(0,gg-5)},${Math.max(0,gb-5)},${fade * 0.9})`;
    ctx.fill();
  }
}

// ─── FOG / MIST VALLEY ───
function drawFog(p) {
  const fogIntensity = Math.sin(Math.PI * p * 0.8) * 0.7;
  if (fogIntensity <= 0.05) return;

  const fogBase = H * lerp(0.6, 0.85, p);
  const fg = ctx.createLinearGradient(0, fogBase - H * 0.15, 0, fogBase + H * 0.1);
  fg.addColorStop(0, 'transparent');
  fg.addColorStop(0.5, `rgba(180,205,225,${fogIntensity * 0.3})`);
  fg.addColorStop(1, `rgba(195,218,235,${fogIntensity * 0.5})`);
  ctx.fillStyle = fg;
  ctx.fillRect(0, fogBase - H * 0.15, W, H * 0.25);
}

// ─── GROUND (near) ───
function drawGround(p) {
  if (p < 0.7) return;
  const fade = (p - 0.7) / 0.3;
  const groundTop = H * lerp(0.9, 0.7, easeInOut(p));

  const gg2 = ctx.createLinearGradient(0, groundTop, 0, H);
  gg2.addColorStop(0, `rgba(20,50,22,${fade * 0.9})`);
  gg2.addColorStop(0.3, `rgba(15,40,18,${fade})`);
  gg2.addColorStop(1, `rgba(10,28,12,${fade})`);
  ctx.fillStyle = gg2;
  ctx.fillRect(0, groundTop, W, H - groundTop);
}

// ─── OVERLAY TINT ───
function drawAtmo(p) {
  // Depth haze / atmospheric perspective
  const hazeAlpha = lerp(0.05, 0, p);
  ctx.fillStyle = `rgba(100,140,190,${hazeAlpha})`;
  ctx.fillRect(0, 0, W, H);
}

// ─── MAIN DRAW ───
function draw(p) {
  ctx.clearRect(0, 0, W, H);

  const starFade = Math.max(0, 1 - p * 2.5);

  drawSky(p);
  drawStars(starFade);
  drawMoon(p);
  drawSun(p);
  drawClouds(p);
  drawMountains(p);
  drawFog(p);
  drawTrees(p);
  drawGround(p);
  drawAtmo(p);
}

// ─── ALTITUDE + VIEW LABELS ───
const views = [
  { threshold: 0,   name: 'Aerial Zenith',       desc: "Bird's eye — 4200m above sea level" },
  { threshold: 0.2, name: 'Cloud Layer',          desc: 'Piercing the mist — 3400m' },
  { threshold: 0.4, name: 'Summit Ridge',         desc: 'Snow-capped peaks — 2800m' },
  { threshold: 0.6, name: 'Alpine Valley',        desc: 'Where rivers are born — 2100m' },
  { threshold: 0.78,name: 'Pine Forest',          desc: 'Ancient deodar groves — 1600m' },
  { threshold: 0.9, name: 'Hill Station Vista',   desc: 'Welcome to the valley — 1200m' },
];

let currentView = -1;
function updateUI(p) {
  // Altitude
  const alt = Math.round(lerp(1200, 4200, 1 - p));
  document.getElementById('alt-value').textContent = alt + 'm';
  document.getElementById('alt-fill').style.height = (100 - p * 85) + '%';

  // Scroll cue
  document.getElementById('scroll-cue').style.opacity = p < 0.08 ? '1' : '0';

  // View label
  let vIdx = 0;
  for (let i = 0; i < views.length; i++) {
    if (p >= views[i].threshold) vIdx = i;
  }
  if (vIdx !== currentView) {
    currentView = vIdx;
    const vn = document.getElementById('view-name');
    const vd = document.getElementById('view-desc');
    vn.style.opacity = '0'; vn.style.transform = 'translateY(8px)';
    vd.style.opacity = '0';
    setTimeout(() => {
      vn.textContent = views[vIdx].name;
      vd.textContent = views[vIdx].desc;
      vn.style.transition = 'opacity 0.5s, transform 0.5s';
      vd.style.transition = 'opacity 0.5s';
      vn.style.opacity = '1'; vn.style.transform = 'translateY(0)';
      vd.style.opacity = '1';
    }, 50);
  }
}

// ─── ANIMATION LOOP ───
let targetProgress = 0;
let animProgress = 0;

function loop() {
  time += 0.015;
  targetProgress = getProgress();
  animProgress += (targetProgress - animProgress) * 0.06;
  progress = animProgress;

  draw(progress);
  updateUI(progress);
  requestAnimationFrame(loop);
}

window.addEventListener('scroll', () => {
  targetProgress = getProgress();
}, { passive: true });

loop();
</script>
